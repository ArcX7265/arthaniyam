name: ArthaNiyam verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ARTHANIYAM_DATABASE_PATH: /tmp/arthaniyam-ci.sqlite3
        run: python -m pytest -q -p no:cacheprovider
      - name: Validate frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/support.js
      - name: Build judge container
        run: docker build --tag arthaniyam:ci .
