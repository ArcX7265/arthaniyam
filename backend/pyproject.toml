[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arthaniyam-api"
version = "0.1.0"
description = "Policy verification and runtime enforcement for autonomous financial actions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "z3-solver>=4.13,<5",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["app"]
